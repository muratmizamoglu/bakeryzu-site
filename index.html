<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BakeryZu</title><meta name="description" content="BakeryZu: learn to bake, one tiny step at a time.">
<style>
:root { color-scheme: light dark; --bg:#FFF8EE; --card:#FFFFFF; --ink:#3B2A20; --muted:#7A6457; --accent:#B4653A; --line:#EADBC8; --note:#FFF1D6; }
@media (prefers-color-scheme: dark) { :root { --bg:#1E1814; --card:#2A221D; --ink:#F3E8DC; --muted:#C2AE9E; --accent:#E59A6A; --line:#463830; --note:#3A2E22; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
nav { display:flex; gap:12px; margin-bottom:8px; }
nav a { color:var(--accent); font-weight:600; text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:4px 14px; }
section { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px 20px 20px; margin-top:24px; }
h1 { font-size:1.6rem; line-height:1.25; margin:20px 0 4px; }
h2 { font-size:1.15rem; margin:28px 0 8px; color:var(--accent); }
ul { padding-left:1.2em; } li { margin:4px 0; }
.table { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:.95rem; }
th, td { text-align:left; vertical-align:top; padding:8px; border-bottom:1px solid var(--line); }
.note { background:var(--note); border-radius:10px; padding:10px 14px; font-size:.95rem; }
footer { color:var(--muted); font-size:.85rem; text-align:center; margin-top:32px; }
@media (max-width:560px) {
  thead { display:none; } table, tbody, tr, td { display:block; width:100%; }
  tr { border-bottom:1px solid var(--line); padding:6px 0; } td { border:0; padding:2px 0; }
  td::before { content:attr(data-label) ": "; font-weight:600; color:var(--muted); }
}
</style></head>
<body><main><section><h1>BakeryZu</h1>
<p>Learn to bake, one tiny step at a time, with Zu the dough ball. For iPhone.</p>
